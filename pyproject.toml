[project]
name = "ccquant"
version = "0.1.0"
description = "Low-frequency US equity cross-sectional momentum trading system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Chang Liu", email = "chang.liu159@gmail.com" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Added in later milestones; declared here so intent is explicit.
data = ["yfinance>=0.2.40", "lxml>=5.2"]   # M1 MVP data source + Wikipedia constituents
live = ["ib_insync>=0.9.86"]     # M4 IBKR execution
viz = ["matplotlib>=3.8", "plotly>=5.22"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccquant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
