# 风控参数
max_position_weight: 0.08          # 单票硬上限
max_sector_weight: 0.35            # 单GICS行业上限
cash_buffer: 0.02                  # 现金缓冲
portfolio_drawdown_alert: 0.25     # 组合断路器:回撤超过则人工复核
order_price_deviation_reject: 0.03 # 订单偏离参考价超过3%拒单
vol_target_annual: null            # v1.1启用,如0.15

tax:                               # 应税账户专属
  st_rate: 0.45                    # 短期资本利得税率(联邦+州,NY/CA高税州)
  lt_rate: 0.25                    # 长期资本利得税率
  long_term_days: 365              # 持有超过此天数算长期
  wash_sale_window_days: 30        # 卖亏后禁止买回窗口
  prefer_long_term: true           # 优先卖出将转长期/亏损lot
  rank_buffer_enter: 15            # 进入名单需排名<=15
  rank_buffer_exit: 25             # 跌出名单需掉出前25才卖(缓冲带)
